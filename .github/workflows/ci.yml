# BUILD ONLY. THE PUBLIC MIRROR PROVES THESE IMAGES BUILD; IT DOES NOT PUBLISH THEM.
#
# mill publishes ghcr.io/millstonehq/{base,go,python,java,bun,tofu,crossplane} from its own
# ci-base-images.yml, natively on two builders, with a registry read-back that fails unless every
# tag carries both architectures. This repository is a copybara export of that source, and if it
# also published it would race those tags from a second place with no coordination -- last writer
# wins, and neither side knows.
#
# THAT IS NOT HYPOTHETICAL HERE. ghcr.io/millstonehq/python:3.14 was published once, on
# 2026-01-01, and never again; by 2026-09-13 Chainguard's packages needed a newer glibc than that
# frozen tag shipped, so every `apk add` on top of it installed a mismatch and reported success.
# One publisher, on a schedule, is the fix for that. Two publishers is the same disease.
#
# A PR here still builds every image, which is what a public mirror is for: someone can verify the
# recipe without credentials. It just does not write to the registry.

name: CI - Base Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-Arch Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Multi-Arch Images
        uses: ./.github/actions/build-images
        with:
          earthly-target: '+publish-multiarch'
          push: 'false'

      - name: Build Summary (PR)
        if: success() && github.event_name == 'pull_request'
        run: |
          echo "✓ All base images built successfully"
          echo "  Foundation:"
          echo "    - base-builder"
          echo "    - base-runtime"
          echo "  Language images:"
          echo "    - base-go / base-go-runtime (Go 1.25)"
          echo "    - base-python / base-python-runtime (Python 3.14)"
          echo "    - base-java / base-java-runtime (Java 25)"
          echo ""
          echo "Platforms: linux/amd64, linux/arm64"

      - name: Not a publisher, and not an automatic importer
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Built every image. Published nothing: mill is the only publisher."
          echo ""
          if git log -1 --format=%B | grep -q "GitOrigin-RevId:"; then
            echo "This commit came from mill's export (GitOrigin-RevId present)."
          else
            echo "EXTERNAL CONTRIBUTION -- this commit did not come from mill."
            echo "It exists only here until someone imports it:"
            echo "    gh workflow run copybara-import-base-images.yml --ref main --repo millstonehq/mill"
            echo ""
            echo "This used to dispatch that import automatically. It no longer does:"
            echo "copybara is a manual operation, so an import is a decision someone makes"
            echo "rather than a push to mill's main that nobody asked for."
          fi
